<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reminder for event: {{e.title}}</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f6f8fa;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 30px auto;
      background-color: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1, h2 {
      color: #333333;
    }
    .details {
      margin-bottom: 30px;
    }
    .details p {
      margin: 8px 0;
      color: #555555;
    }
    .btn {
      display: inline-block;
      margin: 10px;
      padding: 12px 24px;
      font-size: 16px;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
    }
    .accept {
      background-color: #28a745;
    }
    .decline {
      background-color: #dc3545;
    }
    .footer {
      text-align: center;
      font-size: 12px;
      color: #888888;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <input type="hidden" style="display:hidden;" name="invite_id" value="{{e.invite_id}}">
    <div class="header">
      <h1>REMINDER!</h1>
      <h2>A gentle reminder for event: {{e.title}}</h2>
    </div>
    <div class="details">
      <p><strong>Date:</strong>{{e.event_time.date}}</p>
      <p><strong>Time:</strong> {{e.event_time.time}}</p>
      <p><strong>Venue:</strong>{{e.venue}}</p>
      <p><strong>Description:</strong><br>{{e.description}}</p>
    </div>
    <div class="footer">
      If you have any questions, feel free to contact Captain Rogers Doe at captain.rogers.q@gmail.com.
    </div>
  </div>
</body>
</html>
