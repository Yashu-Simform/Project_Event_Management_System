<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tomorrow's Events</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      padding: 20px;
    }
    .container {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      margin: 0 auto;
    }
    h2 {
      color: #2a9d8f;
      margin-bottom: 20px;
    }
    .event {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }
    .event:last-child {
      border-bottom: none;
    }
    .event-title {
      font-size: 16px;
      font-weight: bold;
    }
    .event-time {
      color: #555;
      font-size: 14px;
    }
    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #999;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Here's what's happening tomorrow 🎉</h2>

    {% if events %}
      {% for event in events %}
        <div class="event">
          <div class="event-title">{{ event.title }}</div>
          <div class="event-time">{{ event.event_time|date:"F j, Y, g:i A" }}</div>
        </div>
      {% endfor %}
    {% else %}
      <p>No events scheduled for tomorrow.</p>
    {% endif %}

    <div class="footer">
      This is an automated message from Event Management System.
    </div>
  </div>
</body>
</html>
